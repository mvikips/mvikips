<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mvikips</title>
  <meta name="description" content="Repositorio de proyectos. Formación, analítica y desarrollo.">
  <style>
    :root {
      --blanco: #FFFFFF;
      --negro: #000000;
      --gris-oscuro: #333333;
      --gris-medio: #555555;
      --ciruela: #581845;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0 auto;
      padding: 3rem 1.5rem;
      max-width: 720px;
      background: var(--blanco);
      color: var(--negro);
      font-family: "Times New Roman", Times, serif;
      font-size: 18px;
      line-height: 1.7;
    }
    header {
      border-bottom: 1px solid var(--ciruela);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }
    header h1 {
      font-size: 2rem;
      font-weight: normal;
      margin: 0 0 0.25rem 0;
      letter-spacing: 0.02em;
    }
    header p {
      color: var(--gris-oscuro);
      margin: 0;
    }
    h2 {
      font-size: 1.3rem;
      font-weight: normal;
      border-bottom: 1px solid var(--ciruela);
      padding-bottom: 0.3rem;
      margin-top: 2.5rem;
    }
    ul {
      list-style: none;
      padding-left: 0;
    }
    li {
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--gris-medio);
    }
    li:last-child {
      border-bottom: none;
    }
    a {
      color: var(--ciruela);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    a:hover {
      border-bottom-color: var(--ciruela);
    }
    .ruta {
      display: block;
      color: var(--gris-medio);
      font-size: 0.9rem;
      margin-top: 0.2rem;
    }
    footer {
      border-top: 1px solid var(--ciruela);
      padding-top: 1rem;
      margin-top: 3rem;
      color: var(--gris-medio);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>mvikips</h1>
    <p>Repositorio de proyectos. Formación, analítica y desarrollo.</p>
  </header>

  <main>

    <section>
      <h2>Formación</h2>
      <ul>
        <li>
          <a href="formacion/estudiosbasicos/primario/">Estudios Primarios</a>
          <span class="ruta">/formacion/estudiosbasicos/primario/</span>
        </li>
      </ul>
    </section>

    <section>
      <h2>Apuntes</h2>
      <ul>
        <li>
          <a href="mis_apuntes_de/">Mis apuntes</a>
          <span class="ruta">/mis_apuntes_de/</span>
        </li>
      </ul>
    </section>

  </main>

  <footer>
    <p>María Victoria Perera — 2026 — Licencia MIT</p>
  </footer>

</body>
</html>

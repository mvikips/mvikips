name: Deploy Primario

on:
  push:
    branches: [ main ]
    paths:
      - 'formacion/estudiosbasicos/primario/**'
      - '.github/workflows/deploy-primario.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'formacion/estudiosbasicos/primario/**'
      - '.github/workflows/deploy-primario.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar carpeta de publicación
        run: |
          mkdir -p _site
          rsync -av --exclude='.git' \
                    --exclude='.github' \
                    --exclude='node_modules' \
                    --exclude='_site' \
                    ./ _site/
          touch _site/.nojekyll
          echo "=== Contenido de _site/ ==="
          find _site -type f | head -50
          echo "=== Tamaño total ==="
          du -sh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4